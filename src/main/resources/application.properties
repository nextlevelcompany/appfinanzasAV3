spring.application.name=appfinanzas
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/appfinanzas}
spring.datasource.username=${DB_USERNAME:appfinanzas}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
